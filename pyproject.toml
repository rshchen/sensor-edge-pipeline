[project]
name = "sensor-edge-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "pytest>=9.1.1",
    "torch>=2.14.0",
    "torchvision>=0.29.1",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/basics", "python/pipeline"]

[tool.pytest.ini_options]
testpaths = ["python"]
markers = [
    "slow: marks tests as slow (run with '-m slow' or exclude with '-m \"not slow\"')",
    "edge: marks tests verifying ONNX export or runtime compatibility",
]
