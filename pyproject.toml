[project]
name = "sensor-edge-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/basics", "python/pipeline"]

[tool.pytest.ini_options]
testpaths = ["python"]
markers = [
    "slow: marks tests as slow (run with '-m slow' or exclude with '-m \"not slow\"')",
    "edge: marks tests verifying ONNX export or runtime compatibility",
]